# Secret scan (Grok audit v2, 11/19): every push and pull request is checked for committed passwords / keys.
# Run it by hand (Actions -> Secret scan -> Run workflow) to scan the whole history.
name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
